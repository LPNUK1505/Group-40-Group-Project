                .password_group {
                    position: relative;

                .password_group i{
                    position: absolute;

                }

                .TwoFA_group {
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    align-items: start;
                    flex: 1;
                    margin: 10px 33px;
                }

                .TwoFA_group_group {
                    position: relative;
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    flex: 1;
                    gap: 15px;
                    width: auto;                    
                    padding: 10px 10px 10px 15px;
                    background-color: #f2f2f2;
                    border: 2px solid #333;
                    border-radius: 50px;
                    margin: 10px 33px;
                    font-size: 26px;
                    margin-bottom: 20px;
                }
                
                .TwoFA_group i{
                    font-size: 24px;
                    color: #022340;
                }

                .line_label {
                    display: flex;
                    align-items: center;
                    margin: 10px 70px 0px 70px;
                }

                .line_label hr {
                    flex-grow: 1;
                    border: 0;
                    border-top: 2px solid #03588C;
                    margin: 0px;
                }

                .line_label span {
                    margin: 0px 10px;
                    font-weight: bold;
                    color: #03588C;
                }

                .switch {
                    position: relative;
                    width: 60px;
                    height: 34px;
                }

                .switch input {
                    opacity: 0;
                    width: 0;
                    height: 0;
                }

                .slider {
                    position: absolute;
                    cursor: pointer;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background-color: #ccc;
                    -webkit-transition: .4s;
                    transition: .4s;
                }

                .slider:before {
                    position: absolute;
                    content: "";
                    height: 26px;
                    width: 26px;
                    left: 4px;
                    bottom: 4px;
                    background-color: white;
                    -webkit-transition: .4s;
                    transition: .4s;
                }

                input:checked + .slider {
                    background-color: #03588C;
                }

                input:focus + .slider {
                    box-shadow: 0 0 1px #03588C;
                }

                input:checked + .slider:before {
                    -webkit-transform: translateX(26px);
                    -ms-transform: translateX(26px);
                    transform: translateX(26px);
                }

                .slider.round {
                    border-radius: 34px;
                }

                .slider.round:before {
                    border-radius: 50%;
                }
            </style>
