<!DOCTYPE html>
<html>
   <!-- JAVA line for 'fontawesome' icons -->
   <script src="https://kit.fontawesome.com/d15bb23cbb.js" crossorigin="anonymous"></script>
   <link rel="stylesheet" href="../styles.css">


   <!-- Creates the Header at the top -->
   <div class="header">
       <div class="header-menu-icon">
           <i class="fa-solid fa-bars"></i>
       </div>

       <!-- Creates icons for the right hand side of the header -->
       <div class="header-right-icon">
            <a href="SettingsPersonal.html" class="stayOnPageLink">
                <i class="fa-solid fa-cog fa-spin" style="--fa-animation-duration: 4s;  animation-iteration-count: 0.17;"></i>
            </a>
            <i class="fa-solid fa-user-large"></i>
       </div>
   </div>
   

   <!-- Creates the Sidebar on the left hand side -->
   <div class="sidebar">
        <img src="../GoIkonLogoFinal.png" alt="Goikon Logo" class = "goikon-logo">
        <!-- Creates buttons in the Sidebar -->
        <div class="sidebar-button">
            <a href="SettingsPersonal.html" class="stayOnPageLink">
                <i class="fa-solid fa-user"></i>Personal Details
            </a>
        </div>
        <div class="sidebar-button">
            <a href="SettingsSecurity.html">
                <i class="fa-solid fa-unlock-keyhole"></i>Security
            </a>
        </div>
   </div>

   <!-- Creates the Footer at the bottom -->
   <div class="footer">

       <!-- Creates buttons in the footer -->
       <a href="AboutUs.html">About Us</a>
       <a href="ContactUs.html">Contact Us</a>
   </div>


   <!-- Creates Main Content area -->
   <div class="main-content">
        <form>
            <style>
                form{
                    text-align: center;
                }

                input, select {
                    width: auto;                    
                    padding: 10px 10px 10px 45px;
                    color: #333;
                    border: 2px solid #333;
                    border-radius: 50px;
                    margin: 10px 33px;
                    font-size: 26px;
                    margin-bottom: 20px;
                    font-family:Verdana, Tahoma, sans-serif;
                    resize: none;
                }
                
                input[type="date"]::-webkit-calendar-picker-indicator {
                    position: absolute;
                    left: 50px;
                    font-size: 24px;
                    color: #022340;
                }

                label{
                    text-align: left;
                    margin-left: 50px;
                }

                button {
                    background-color: #F2F2F2;
                    color: #333;
                    padding: 25px;
                    border: 2px solid #333;
                    border-radius: 10px;
                    cursor: pointer;
                    font-size: 28px;
                    font-family:Verdana, Tahoma, sans-serif
                }

                .form_row {
                    display: flex;
                }

                .name_group {
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    flex: 1;
                    margin: 10px 33px;
                }
                .name_group i{
                    position: absolute;
                    left: 50px;
                    top: 50%;
                    font-size: 24px;
                    color: #022340;
                }

                .contact_group {
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    flex: 1;
                    margin: 10px 33px;
                }
                .contact_group i{
                    position: absolute;
                    left: 50px;
                    top: 50%;
                    font-size: 24px;
                    color: #022340;
                }

                .additional_group {
                    position: relative;
                    display: flex;
                    flex-direction: column;
                    flex: 1;
                    margin: 10px 33px;
                }
                .additional_group i{
                    position: absolute;
                    left: 50px;
                    top: 50%;
                    font-size: 24px;
                    color: #022340;
                }
                .line_label {
                    display: flex;
                    align-items: center;
                    margin: 10px 70px 0px 70px;
                }

                .line_label hr {
                    flex-grow: 1;
                    border: 0;
                    border-top: 2px solid #03588C;
                    margin: 0px;
                }

                .line_label span {
                    margin: 0px 10px;
                    font-weight: bold;
                    color: #03588C;
                }
            </style>

            <h1><b>Settings</b></h1>

            <h3>
                <div class="line_label">
                    <hr>
                    <span>Full Name</span>
                    <hr>
                </div>
                <div class="form_row">
                    <div class="name_group">
                        <label for="Firstname">*First Name</label>
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="Firstname" name="Firstname" required>
                    </div>
                    <div class="name_group">
                        <label for="Surname">*Surname</label>
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="Surname" name="Surname" required>
                    </div>
                </div>

                <div class="line_label">
                    <hr>
                    <span>Contact</span>
                    <hr>
                </div>
                <div class="form_row">
                    <div class="contact_group">
                        <label for="email">*Email</label>
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="contact_group">
                        <label for="phone-num">*Phone Number</label>
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone-num" name="phone-num" required>
                    </div>
                </div>

                <div class="line_label">
                    <hr>
                    <span>Additional</span>
                    <hr>
                </div>
                <div class="form_row">
                    <div class="additional_group">
                        <label for="dob">*Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="additional_group">
                        <label for="nationality">*Nationality</label>
                        <select id="nationality" name="nationality">
                            <option value="">Select Country</option>
                        </select>
                    </div>

                    <script>
                        // Fetch list of countries using Restcountries API
                        fetch('https://restcountries.com/v3.1/all')
                            .then(response => response.json())
                            .then(data => {
                                const nationalitySelect = document.getElementById('nationality');
                                // Sort countries alphabetically
                                data.sort((a, b) => a.name.common.localeCompare(b.name.common));

                                // Create option for each country
                                data.forEach(country => {
                                    const option = document.createElement('option');
                                    option.textContent = country.name.common;
                                    nationalitySelect.appendChild(option);
                                });
                            })
                            .catch(error => console.log('Error fetching countries:', error));
                    </script>
                </div>

                <button type="submit">Save Changes</button>
            </h3>
        </form>
    </div>
    
    <!-- JAVA script to change colour of sidebar button referring to active page-->
    <script src="../sidebar.js"></script>
    <script>
        window.onload = preventPageRefresh;
    </script>
</html>
