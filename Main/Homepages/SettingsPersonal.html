                .contact_group {
                    position: relative;

                .contact_group i{

                }

                .additional_group {
                    position: relative;

                }
                .additional_group i{
                    position: absolute;

                }
                .line_label {
                    display: flex;

                .line_label hr {

                    border-top: 2px solid #03588C;

            <h1><b>Personal Details</b></h1>

            <h3>
                <div class="line_label">
                    <hr>
                    <span>Full Name</span>
                    <hr>
                </div>
                <div class="form_row">
                    <div class="name_group">
                        <label for="Firstname">*First Name</label>
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="Firstname" name="Firstname" required>
                    </div>
                    <div class="name_group">
                        <label for="Surname">*Surname</label>
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="Surname" name="Surname" required>
                    </div>
                </div>

                <div class="line_label">
                    <hr>
                    <span>Contact</span>
                    <hr>
                </div>
                <div class="form_row">
                    <div class="contact_group">
                        <label for="email">*Email</label>
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="contact_group">
                        <label for="phone-num">*Phone Number</label>
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone-num" name="phone-num" required>
                    </div>
                </div>

                <div class="line_label">
                    <hr>
                    <span>Additional</span>
                    <hr>
                </div>
                <div class="form_row">
                    <div class="additional_group">
                        <label for="dob">*Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="additional_group">
                        <label for="nationality">*Nationality</label>
                        <select id="nationality" name="nationality">
                            <option value="">Select Country</option>
                        </select>
                    </div>

                    <script>
                        // Fetch list of countries using Restcountries API
                        fetch('https://restcountries.com/v3.1/all')
                            .then(response => response.json())
                            .then(data => {
                                const nationalitySelect = document.getElementById('nationality');
                                // Sort countries alphabetically
                                data.sort((a, b) => a.name.common.localeCompare(b.name.common));

                                // Create option for each country
                                data.forEach(country => {
                                    const option = document.createElement('option');
                                    option.textContent = country.name.common;
                                    nationalitySelect.appendChild(option);
                                });
                            })
                            .catch(error => console.log('Error fetching countries:', error));
                    </script>
                </div>

                <button type="submit">Save Changes</button>
            </h3>
