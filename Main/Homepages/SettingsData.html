<!DOCTYPE html>
<html>
   <!-- JAVA line for 'fontawesome' icons -->
   <script src="https://kit.fontawesome.com/d15bb23cbb.js" crossorigin="anonymous"></script>
   <link rel="stylesheet" href="../styles.css">


   <!-- Creates the Header at the top -->
   <div class="header">

       <!-- Creates icons for the right hand side of the header -->
       <div class="header-right-icon">
            <a href="SettingsPersonal.html" class="stayOnPageLink">
                <i class="fa-solid fa-cog fa-spin" style="--fa-animation-duration: 4s;  animation-iteration-count: 0.17;"></i>
            </a>
           <i class="fa-solid fa-user-large"></i>
       </div>
   </div>
   

   <!-- Creates the Sidebar on the left hand side -->
   <div class="sidebar">
        <img src="../GoIkonLogoFinal.png" alt="Goikon Logo" class = "goikon-logo">
        <!-- Creates buttons in the Sidebar -->
        <div class="sidebar-button">
            <a href="SettingsPersonal.html">
                <i class="fa-solid fa-user"></i>Personal Details
            </a>
        </div>
        <div class="sidebar-button">
            <a href="SettingsSecurity.html">
                <i class="fa-solid fa-unlock-keyhole"></i>Account Security
            </a>
        </div>
        <div class="sidebar-button">
            <a href="SettingsData.html" class="stayOnPageLink">
                <i class="fa-solid fa-cloud-arrow-up"></i>Manage Data
            </a>
        </div>
   </div>

   <!-- Creates the Footer at the bottom -->
   <div class="footer">

       <!-- Creates buttons in the footer -->
       <a href="AboutUs.html">About Us</a>
       <a href="ContactUs.html">Contact Us</a>
   </div>


   <!-- Creates Main Content area -->
   <div class="main-content">
        <form>
            <style>
                form{
                    text-align: center;
                }

                input {
                    padding: 10px 10px;
                    color: #333;
                    border: 2px solid #333;
                    border-radius: 50px;
                    margin: 10px 33px;
                    font-size: 16px;
                    font-family:Verdana, Tahoma, sans-serif;
                }

                label{
                    text-align: left;
                    margin-left: 50px;
                }

                button {
                    background-color: #F2F2F2;
                    color: #333;
                    padding: 25px;
                    border: 2px solid #333;
                    border-radius: 10px;
                    cursor: pointer;
                    font-size: 28px;
                    font-family:Verdana, Tahoma, sans-serif;
                    margin-top: 20px;
                }

                .form_row {
                    display: flex;
                    width: auto;
                    margin: 0 300px;
                }

                .download_group {
                    position: relative;
                    display: flex;
                    align-items: center;
                    flex-direction: row;
                    flex: 1;
                    font-size: 16px;
                    color: #f2f2f2;
                }

                .password_group {
                    display: flex;
                    flex-direction: column;
                    flex: 1;
                    text-align: left;
                    font-size: 28px;
                    color: #f2f2f2;
                    margin: 10px 33px;
                }

                .delete_group {
                    position: relative;
                    display: flex;
                    align-items: center;
                    flex-direction: row;
                    flex: 1;
                    font-size: 16px;
                    color: #f2f2f2;
                }

                .line_label {
                    display: flex;
                    align-items: center;
                    margin: 10px 70px 0px 70px;
                }

                .line_label hr {
                    flex-grow: 1;
                    border: 0;
                    border-top: 2px solid #03588C;
                    margin: 0px;
                }

                .line_label span {
                    margin: 0px 10px;
                    font-weight: bold;
                    color: #03588C;
                }

                .h7{
                    text-align: center;
                    font-size: 10px;
                    color: #f2f2f2;
                }
            </style>

            <h1><b>Manage Data</b></h1>
            <p><b>Concerned about what data we store for you? Review your data, and correct, delete, or download it.</b></p>

            <h3>
                <div class="line_label">
                    <hr>
                    <span>Download Data</span>
                    <hr>
                </div>
            </h3>
            <h7>Your data will be emailed directly to you.</h7>
            <h3>
                <div class="form_row">
                    <div class="password_group">
                        <label for="Password">*Password</label>
                        <input type="text" id="Password" name="Password" required>

                        <label for="PasswordConfirm">*Confirm Password</label>
                        <input type="text" id="PasswordConfirm" name="PasswordConfirm" required>
                    </div>

                    <div class="download_group">
                        <button type="submit">Download Data</button>
                    </div>
                </div>

                <div class="line_label">
                    <hr>
                    <span>Delete Data</span>
                    <hr>
                </div>
            </h3>
                </h7>This action is irreversible.</h7>

                <div class="form_row">
                    <div class="password_group">
                        <label for="Password">*Password</label>
                        <input type="text" id="Password" name="Password" required>

                        <label for="PasswordConfirm">*Confirm Password</label>
                        <input type="text" id="PasswordConfirm" name="PasswordConfirm" required>
                    </div>

                    <div class="delete_group">
                        <button type="submit">Delete Data</button>
                    </div>
                </div>
            </h3>
        </form>
    </div>

    <!-- JAVA script to change colour of sidebar button referring to active page-->
    <script src="../sidebar.js"></script>
    <script>
        window.onload = preventPageRefresh;
    </script>
</html>
