<!DOCTYPE html>
 <html>
    <!-- JAVA line for 'fontawesome' icons -->
    <script src="https://kit.fontawesome.com/d15bb23cbb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../styles.css">


    <!-- Creates the Header at the top -->
    <div class="header">
        <div class="header-menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>

        <!-- Creates icons for the right hand side of the header -->
        <div class="header-right-icon">
            <i class="fa-solid fa-gear"></i>
            <i class="fa-solid fa-user-large"></i>
        </div>
    </div>
    

    <!-- Creates the Sidebar on the left hand side -->
    <div class="sidebar">
        <img src="../GoikonLogoFinal.png" alt="Goikon Logo" class = "goikon-logo">

        <!-- Creates buttons in the Sidebar -->
        <button type="button" onclick="location.href='Team overview.html'">Team Overview</button>
        <button type="button" onclick="location.href='Roster Management.html'">Roster Management</button>
        <button type="button" onclick="location.href='Match Preperation.html'">Match Preperation</button>
        <button type="button" onclick="location.href='Upcoming Matches.html'">Upcoming Matches</button>
        <button type="button" onclick="location.href='Player stats.html'">Player Stats</button>
    </div>


    <!-- Creates the Footer at the bottom -->
    <div class="footer">

        <!-- Creates buttons in the footer -->
        <a href="#Option 1">Option 1</a>
        <a href="#Option 2">Option 2</a>
        <a href="#Option 3">Option 3</a>
    </div>


    <!-- Creates Main Content area -->
    <div class="main-content">
        <h1> Roster Management </h1>
        <button type="button" onclick="location.href='add player.html'">Add new player</button>

        <table border="1">
            <tr>
                <th>Player Name</th>
                <th>Position</th>
                <th>Shirt Number</th>
            </tr>
            <tr>
                <td>Lionel Messi</td>
                <td>Forward</td>
                <td>10</td>
            </tr>
        </table>
    </div>
</html>
