<!DOCTYPE html>
 <html>
    <!-- JAVA line for 'fontawesome' icons -->
    <script src="https://kit.fontawesome.com/d15bb23cbb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../styles.css">
    <!-- Creates the Header at the top -->
    <div class="header">
        <div class="header-menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>
        <!-- Creates icons for the right hand side of the header -->
        <div class="header-right-icon">
            <i class="fa-solid fa-gear"></i>
            <i class="fa-solid fa-user-large"></i>
        </div>
    </div>
    
    <!-- Creates the Sidebar on the left hand side -->
    <div class="sidebar">
        <img src="../GoikonLogoFinal.png" alt="Goikon Logo" class = "goikon-logo">
        <!-- Creates buttons in the Sidebar -->
        <button type="button" href="#Option 1">Team Overview</button>
        <button type="button" href="#Option 2">Roster Management</button>
        <button type="button" href="#Option 3">Match Preperation</button>
        <button type="button" href="#Option 4">Upcoming Matches</button>
        <button type="button" href="#Option 5">Player Stats</button>
    </div>
    <!-- Creates the Footer at the bottom -->
    <div class="footer">
        <!-- Creates buttons in the footer -->
        <a href="#Option 1">Option 1</a>
        <a href="#Option 2">Option 2</a>
        <a href="#Option 3">Option 3</a>
    </div>

    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            width: 100%;
            /* z-index: 20000000000000; */
        }
        .left {
            padding: 20px;
            width: 49%;
            text-align: left;
        }
        .right {
            padding: 20px;
            width: 49%;
            text-align: right;
        }
    </style>

    <!-- Creates Main Content area -->
    <div class="main-content">
        <h1> Match Preperation </h1>

        <div class="container">
            <div class="left">
                <h3><u>Set Piece Specialists</u></h3>
                <p>Penalty Kicks: </p>
                <p>Free Kicks - Short Range:</p>
                <P>Free Kicks - Long Range:</P>
                <p>Corner Kicks - Left:</p>
                <P>Corner Kicks - Right:</P>
            </div>
            <div class="right">
                <h3><u>Coaches and Staff</u></h3>
                <p>Head Coach:</p>
                <p>Assistant Manager:</p>
                <p>Chief Analyst:</p>
                <p>Physiotherapist:</p>
                <p>Head Medic:</p>
            </div>
        </div>
    </div>
</html>
